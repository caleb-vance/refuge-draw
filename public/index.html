:root{
  color-scheme:dark;
  --bg:#0b0e0b;--surface:#181c17;--raised:#2a3027;--line:#3a4236;--ink:#ffffff;--muted:#d6dbd1;
  --accent:#ffc81f;--accent-ink:#141000;--chestnut:#ffc81f;--speculum:#ffc81f;--red:#ff5c4d;--green:#7ee081;

  --display:"Oswald","Arial Narrow",sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}

*{box-sizing:border-box}

#map{position:absolute;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{font-family:var(--body);background:var(--bg)}
h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:28px;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
p{margin:0}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top of the map */
#brand{position:absolute;z-index:500;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.92);border-radius:10px;padding:5px 12px 5px 6px;pointer-events:none}
#brand svg{width:46px;height:46px;flex:none}
#brand span{font:400 20px/1 var(--brand);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
#top{position:absolute;z-index:900;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#shoot{background:rgba(0,0,0,.92);border-radius:10px;padding:6px 11px;text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
#shoot small{display:block;font-size:12px;font-weight:600;color:var(--ink)}
#shoot b{display:block;font:700 22px/1.1 var(--display);color:var(--accent);white-space:nowrap}
.tools{display:flex;gap:8px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;background:rgba(0,0,0,.92);border-radius:10px;color:var(--ink)}
.tool[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:21px;height:21px}
#layers{width:min(260px,calc(100vw - 24px));background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:11px;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:8px;padding:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px;font:500 15px var(--display);letter-spacing:.02em;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
#note{position:absolute;z-index:500;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;width:max-content;max-width:calc(100vw - 32px)}
#legend{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);display:flex;flex-wrap:wrap;gap:4px 10px;background:rgba(0,0,0,.92);border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;color:var(--ink);max-height:40vh;overflow-y:auto}
#legend div{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sheet-full #legend{display:none}
#legendbtn{all:unset;cursor:pointer;flex:0 0 100%;display:flex;justify-content:space-between;align-items:center;font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding:2px 0}
#legendbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#legend.closed{left:auto;width:max-content;min-width:130px}
#legendbtn .chev{font-size:16px;margin-left:12px}
.fac{display:block;box-sizing:border-box}
.fac.blind{width:13px;height:13px;margin:1.500px;border-radius:50%;background:#fff;border:3px solid #0d0f11;box-shadow:0 0 0 1px #fff}
.fac.blind.ada{background:#4da3ff}
.fac.park{width:20px;height:20px;border-radius:4px;background:#1558d6;color:#fff;font:800 13px/20px var(--body);text-align:center;border:1px solid #fff}
#legend i.fac{flex:none;font-style:normal}
#legend i.fac.park{width:14px;height:14px;font-size:10px;line-height:13px}
#legend i.fac.blind{width:10px;height:10px;margin:0;border-width:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none;opacity:.9}
.sw.line{background:none;border:2px solid #fff}
#viewer{position:absolute;inset:0;z-index:2000;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#viewer img{display:block;width:100%;min-width:640px;max-width:none;background:#fff}
#viewer button{position:sticky;top:10px;left:10px;margin:10px;z-index:1}
.sk{display:inline-block;width:14px;height:12px;border-radius:2px;flex:none}
.sk.sym{width:14px;height:14px;background:#f2f1ea;color:#111;font:700 10px/14px var(--body);text-align:center;font-style:normal}
.wp{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.pinrow{display:block}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.daycards .card{display:flex;flex-direction:column;gap:3px;padding:10px}
.dayodds{font:700 22px var(--display);line-height:1.15;color:var(--accent)}
ul.signup{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
ul.signup li{background:var(--surface);border-radius:8px;padding:9px 12px}
ul.signup b{display:block;font-weight:700}
.pin{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid #0d0f11;box-shadow:0 0 0 1.500px var(--accent)}
.pin.sel{background:#fff;box-shadow:0 0 0 3px var(--accent)}
.leaflet-tooltip.pinlabel{background:rgba(0,0,0,.92);border:0;border-radius:5px;color:var(--ink);box-shadow:none;font:700 14px var(--body);padding:2px 7px;display:none}
.leaflet-tooltip.pinlabel::before{display:none}
.show-labels .leaflet-tooltip.pinlabel{display:block}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);border-radius:8px}
.leaflet-popup-content{margin:10px 12px;font:400 14px var(--body)}
.leaflet-popup-content b{font-size:15px;display:block}
.leaflet-top.leaflet-left{top:calc(env(safe-area-inset-top,0px) + 54px)}
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.8)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)}
.overlay-map{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;max-width:none!important}

/* sheet */
#sheet{border-top:3px solid var(--ink);position:absolute;z-index:800;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top,0px) - 56px);display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;transform:translateY(var(--sheet-y,50%));transition:transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform}
#sheet.dragging{transition:none}
.sheet-full #top{display:none}
#grab{flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-bottom:1px solid var(--line)}
#handle{width:100%;padding:9px 0 4px;display:block;background:none;border:0;cursor:grab}
#handle span{display:block;width:36px;height:4px;margin:auto;border-radius:2px;background:var(--line)}
nav{display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{all:unset;cursor:pointer;text-align:center;padding:7px 2px 11px;font:500 16px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 -3px 0 var(--speculum)}
#body{flex:1;min-height:0;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
#detail{z-index:5}
.pad{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.rg{font:600 15px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);padding-block:16px 4px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row .txt{display:flex;flex-direction:column;min-width:0}
.row b{font-weight:700;font-size:18px;line-height:1.2}
.row small{color:var(--muted);font-size:14px}
.row .odds{font:700 18px var(--display);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .odds span{display:block;font:500 12px var(--body);color:var(--muted)}
.back{all:unset;cursor:pointer;font:600 16px var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.kicker{font:500 14px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;text-decoration:none;font:500 15px var(--display);letter-spacing:.02em;padding:9px 12px;border-radius:8px;background:var(--raised);color:var(--ink);border:0;cursor:pointer}
.btn.main,.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border-radius:8px;padding:10px;min-width:0}
.stats b{display:block;font:700 24px var(--display);line-height:1.15;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:9px;min-width:0}
.card{background:var(--surface);border-radius:8px;padding:12px 13px;min-width:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:14px}
.quiet{color:var(--muted);font-size:14px;margin:0}
.big{font:700 54px var(--display);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats b.ok{color:var(--green)}
.stats b.lim{color:var(--accent)}
.stats b.nope{color:var(--red)}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.wx svg{width:64px;height:64px;color:var(--accent)}
.wx .big{font-size:44px}
.wx .big small{font:600 18px var(--body);color:var(--ink)}
.dir{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dir svg{width:14px;height:14px;color:var(--accent);flex:none}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;border-radius:3px;background:var(--speculum);min-width:2px}
.bar span:first-child{color:var(--muted)}
.bar span:last-child{text-align:right}
.sp{grid-template-columns:minmax(0,132px) minmax(0,1fr) 34px}
.sp span:first-child{color:var(--ink)}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.tl li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding-block:11px;border-top:1px solid var(--line)}
ol.tl li:first-child{border-top:0}
.when{font:600 16px/1.2 var(--display)}
.when small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
li.past .when,li.past .what{opacity:.5}
li.key .when{color:var(--accent)}
.what b{display:block;font-weight:700}
.what{min-width:0;font-size:15px}
select{font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;max-width:300px}
input[type=date],input[type=text]{font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;max-width:260px}
input.mono{font-family:var(--mono);max-width:none}
label{font-weight:500;font-size:14px;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
td.mono{font:500 13px var(--mono);white-space:nowrap}
.scroll{overflow-x:auto}
details{background:var(--surface);border-radius:8px;min-width:0}
summary{cursor:pointer;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:500}
summary span{font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
details .inner{padding:0 13px 12px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--raised);font-weight:500}
.tag.old{background:var(--warn-bg);color:var(--warn)}
#hit{font-size:15px}
#hit b.entry{font:700 34px var(--display);line-height:1.1;color:var(--accent);display:block;margin-bottom:4px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
@media (min-width:860px){
  #sheet{top:0;bottom:0;left:0;right:auto;width:400px;height:100%;border-radius:0;border-right:1px solid var(--line);transform:none;transition:none}
  #handle{display:none}
  #legend{left:calc(100% + 12px);right:auto;bottom:12px;width:max-content;max-width:520px}
  .sheet-full #legend{display:flex}
  nav button{padding-top:13px}
  #brand{left:414px}
  .sheet-full #top{display:flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

      <button class="tool" id="locate" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg></button>
      <button class="tool" id="layerbtn" aria-label="Map layers" aria-expanded="false" aria-controls="layers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 9l10 6 10-6-10-6z"/><path d="m2 15 10 6 10-6"/></svg></button>
    </div>
    <div id="layers" hidden>
      <div class="seg"><button id="base-sat" aria-pressed="true">Satellite</button><button id="base-topo" aria-pressed="false">Topo</button></div>
      <label class="chk"><input type="checkbox" id="l-overlay" checked>Hunt map</label>
      <div><label for="l-opacity" class="quiet">Hunt map strength</label><input type="range" id="l-opacity" min="20" max="100" value="85"></div>

/* NOAA sunrise approximation, returning a UTC ms timestamp for the given local date. */
function sunriseUTC(date, lat, lng){
  const rad = Math.PI / 180;
  const start = Date.UTC(date.getFullYear(), 0, 0);
  const n = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - start) / DAY);
  const g = 2 * Math.PI / 365 * (n - 1 + 6 / 24 - 0.5);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(dec)) - Math.tan(lat * rad) * Math.tan(dec)) / rad;
  const mins = 720 - 4 * (lng + ha) - eq;
  return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) + mins * 6e4;

      <li><div class="when">17 days<small>before hunt</small></div><div class="what"><b>Deadline</b>11:59 PM. Each choice costs $1.34. A duplicate choice is disqualified, and fees are not refunded if the area closes.</div></li>
      <li><div class="when">7 days<small>before hunt</small></div><div class="what"><b>Results</b>Posted at least 7 days ahead. Drawn hunters get an email and a letter.</div></li>
    </ol></div>
    <div class="btns">${link(LICENSE_URL, 'Apply in your CDFW account', 'btn main')}${link(AGENT_URL, 'Find a license agent', 'btn')}</div></section>
    <section><h3>In-person vacancy draw</h3><ul class="plain">
      <li>Spots left after reservations go to a lottery or first-come line, depending on the refuge. The map is color coded by which one.</li>
      <li>Most lotteries take sign-ups the night before, usually 6:00 to 8:00 or 9:00 PM.</li>
      <li>Only one person from your party needs to enter, and they need a valid GO ID and hunting license.</li>
      <li>You can enter only one lottery per hunt day.</li>
      <li>On hunt morning, reservations check in first, then lottery entries in draw order, then any first-come line.</li>
    </ul></section>
    <section><h3>Blind results</h3><p>Sacramento, Delevan, Colusa and Sutter have results by blind on their Birds pages, from the newest files USFWS has online. Other refuges may post theirs at the check station.</p></section>
    <section><h3>How the odds work</h3><p>Odds are for the in-person lottery on the same weekday. We take the people who put in on the last matching hunt, then divide the estimated lottery spots by that number. CDFW doesn't publish spots by date, so spots are estimated from the hunters it reported that day. Numbers appear after CDFW posts hunt results, which can lag about a week.</p></section>
    <section><h3>What everyone needs</h3><ul class="plain">
      <li>California hunting license</li>
      <li>Photo ID (junior hunters exempt)</li>
      <li>Prepaid wildlife area pass (junior hunters exempt)</li>

      <li>California duck validation (junior hunters exempt)</li>

    </ul><div class="warn">Check stations do not sell licenses, passes or validations. Buy them before you drive out.</div></section>

      <tr><td>Nov 21, 2026</td><td>Free Hunting Day (registration required), also Apr 10, 2027</td></tr>

    <p class="quiet">Refuge Rat is an unofficial prototype. It is not made by or affiliated with CDFW or USFWS. Rules change during the season, so confirm with the area before you go.</p></section>

}

/* ---------- draw results ---------- */
function renderDraws(){
  const all = DATA.draws || [];
  const current = all.filter(isCurrent), older = all.filter(d => !isCurrent(d));
  const h = (DATA.harvest || {}).files || [];
  const prior = $('#ticket') ? $('#ticket').value : '';
  $('#drawview').innerHTML = `<div class="pad">
    <div><div class="kicker">In-person vacancy draws</div><h2>Find your ticket</h2><p class="quiet">${esc(freshText())}</p></div>
    <form id="tform"><label for="ticket">Ticket number</label><input class="mono" type="text" id="ticket" inputmode="numeric" autocomplete="off" placeholder="VDR-0000014833" value="${esc(prior)}"></form>
    <div id="hit" class="card" hidden aria-live="polite"></div>
    <section><h3>Latest lists</h3>
      ${current.length ? current.map(drawCard).join('') : `<p class="quiet">No lists from the past two weeks are posted right now.</p>`}
    </section>
    ${older.length ? `<section><h3>Older lists still posted</h3>${older.map(drawCard).join('')}</section>` : ''}
    <section><h3>Your reservation draw</h3>
      <p>Reservation results are private to your CDFW account, so this page can't show them. Sign in on the CDFW site to see yours.</p>
      <div class="btns">${link(LICENSE_URL, 'Open my CDFW account', 'btn main')}</div>
    </section>
    <section><h3>Hunt results files</h3>
      ${h.length ? `<div class="btns">${h.map(f => link(f.url, f.label.replace(/\(PDF\)/i, '').trim(), 'btn')).join('')}</div>` : `<p class="quiet">We could not load the hunt results list from CDFW.</p>`}
    </section>
    <p class="quiet">Lists show ticket numbers only. Not every refuge posts a list online. Check the official PDF or the check station before you rely on a result.</p>
    ${(DATA.errors || []).length ? `<p class="quiet">${DATA.errors.length} CDFW file(s) could not be read on the last pull.</p>` : ''}
  </div>`;
  const input = $('#ticket');
  const run = () => findTicket(input.value);
  input.oninput = run;
  $('#tform').onsubmit = e => { e.preventDefault(); run(); };
  if (prior) run();
}
function findTicket(raw){
  const box = $('#hit');
  const q = raw.replace(/\D/g, '').replace(/^0+/, '');
  if (q.length < 3) { box.hidden = true; return; }
  const hits = [];
  (DATA.draws || []).forEach(d => (d.entries || []).forEach(e => { if (e[0].replace(/\D/g, '').replace(/^0+/, '') === q) hits.push({d, e}); }));
  box.hidden = false;
  box.className = hits.length ? 'card ok' : 'card';
  box.innerHTML = hits.length
    ? hits.map(({d, e}) => {
        const hunt = usDate(d.huntDate);
        return `<b class="entry">Entry #${e[1]}</b><p>${esc(d.area || d.key)}, hunt date ${hunt ? esc(fmt(hunt)) : 'unknown'}. Party of ${e[2]}, out of ${(d.entries || []).length} tickets. A low number is called first, and a spot depends on how many remain. ${link(d.url, 'Official PDF')}</p>`;
      }).join('')
    : `No match in the lists we have. Check the number, or look at the check station, since some refuges do not post online.`;
}

/* ---------- shell ---------- */
function setTab(t){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#mapview').hidden = t !== 'map';
  $('#howview').hidden = t !== 'how';
  $('#drawview').hidden = t !== 'draw';
  $('#birdview').hidden = t !== 'birds';
  $('#detail').hidden = true;
  if (t === 'map' && selected) { $('#mapview').hidden = true; $('#detail').hidden = false; }
}
function renderAll(){
  renderDraws();
  renderList();
  renderBirds();
  if (selected) openDetail(selected, true);
}
document.addEventListener('click', e => {
  const tab = e.target.closest('nav button'); if (tab) { setTab(tab.dataset.tab); return; }
  const row = e.target.closest('.row'); if (row) { detailPane = row.dataset.birds ? 'birds' : 'plan'; setTab('map'); openDetail(row.dataset.id); return; }
});

drawLegend(null);
initSheet(); initControls(); renderList(); renderHow(); renderAll(); initMap();

/* On a server, swap in live data. As a static page this request fails and the built-in copy stays. */
if (location.protocol.startsWith('http')) {
  fetch('/api/live', {cache:'no-store'}).then(r => {
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) throw 0;
    return r.json();
  }).then(d => { if (d && d.draws && d.draws.length) { DATA = d; renderAll(); } }).catch(() => {});
}
</script>
