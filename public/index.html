<style>
/* Layout: the map is the page, one quiet sheet holds everything else. Few colors, thin lines, no ornament.
   Color: near-black with one signal yellow, for a phone read in the dark before shoot time. */
:root{
  color-scheme:dark;
  --bg:#0d0f11;--surface:#16191c;--raised:#1f2327;--line:#2a2f34;--ink:#f3f4f2;--muted:#9aa1a6;
  --accent:#f2c230;--accent-ink:#141104;--red:#ff5c4d;--green:#7ee081;
  --warn-bg:#2b2410;--warn:#f2d680;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Archivo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-stretch:100%;overflow:hidden}
#app{position:absolute;inset:0;overflow:hidden}
#map{position:absolute;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{font-family:var(--body);background:var(--bg)}
h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:24px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top of the map */
#brand{position:absolute;z-index:500;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:rgba(13,15,17,.86);border-radius:10px;padding:5px 12px 5px 6px;pointer-events:none}
#brand svg{width:34px;height:34px;flex:none}
#brand span{font:800 18px/1 var(--display);font-stretch:125%;letter-spacing:-.01em;white-space:nowrap}
#top{position:absolute;z-index:900;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#shoot{background:rgba(13,15,17,.86);border-radius:10px;padding:6px 11px;text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
#shoot small{display:block;font-size:11px;color:var(--muted)}
#shoot b{display:block;font:700 19px/1.1 var(--display);color:var(--accent);white-space:nowrap}
.tools{display:flex;gap:8px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;width:42px;height:42px;display:grid;place-items:center;background:rgba(13,15,17,.86);border-radius:10px;color:var(--ink)}
.tool[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:21px;height:21px}
#layers{width:min(260px,calc(100vw - 24px));background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:11px;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:8px;padding:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:7px;font-weight:500;font-size:14px;border-radius:6px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
#note{position:absolute;z-index:500;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;width:max-content;max-width:calc(100vw - 32px)}
#legend{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);display:flex;flex-wrap:wrap;gap:3px 10px;background:rgba(13,15,17,.86);border-radius:8px;padding:5px 9px;font-size:11px;pointer-events:none}
#legend div{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sheet-full #legend{display:none}
.fac{display:block;box-sizing:border-box}
.fac.blind{width:13px;height:13px;margin:1.500px;border-radius:50%;background:#fff;border:3px solid #0d0f11;box-shadow:0 0 0 1px #fff}
.fac.blind.ada{background:#4da3ff}
.fac.park{width:20px;height:20px;border-radius:4px;background:#1558d6;color:#fff;font:800 13px/20px var(--body);text-align:center;border:1px solid #fff}
#legend i.fac{flex:none;font-style:normal}
#legend i.fac.park{width:14px;height:14px;font-size:10px;line-height:13px}
#legend i.fac.blind{width:10px;height:10px;margin:0;border-width:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none;opacity:.9}
.sw.line{background:none;border:2px solid #fff}
#viewer{position:absolute;inset:0;z-index:2000;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#viewer img{display:block;width:100%;min-width:640px;max-width:none;background:#fff}
#viewer button{position:sticky;top:10px;left:10px;margin:10px;z-index:1}
.wp{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.pinrow{display:block}
.daycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.daycards .card{display:flex;flex-direction:column;gap:3px;padding:10px}
.dayodds{font-weight:800;font-size:20px;line-height:1.15;color:var(--accent)}
ul.signup{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
ul.signup li{background:var(--surface);border-radius:8px;padding:9px 12px}
ul.signup b{display:block;font-weight:700}
.pin{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid #0d0f11;box-shadow:0 0 0 1.500px var(--accent)}
.pin.sel{background:#fff;box-shadow:0 0 0 3px var(--accent)}
.leaflet-tooltip.pinlabel{background:rgba(13,15,17,.82);border:0;border-radius:5px;color:var(--ink);box-shadow:none;font:500 12px var(--body);padding:1px 6px;display:none}
.leaflet-tooltip.pinlabel::before{display:none}
.show-labels .leaflet-tooltip.pinlabel{display:block}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);border-radius:8px}
.leaflet-popup-content{margin:10px 12px;font:400 14px var(--body)}
.leaflet-popup-content b{font-size:15px;display:block}
.leaflet-top.leaflet-left{top:calc(env(safe-area-inset-top,0px) + 54px)}
.leaflet-control-attribution{font-size:9px;background:rgba(13,15,17,.6)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)}
.overlay-map{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;max-width:none!important}

/* sheet */
#sheet{position:absolute;z-index:800;left:0;right:0;bottom:0;height:calc(100% - env(safe-area-inset-top,0px) - 56px);display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;transform:translateY(var(--sheet-y,50%));transition:transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform}
#sheet.dragging{transition:none}
.sheet-full #top{display:none}
#grab{flex:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-bottom:1px solid var(--line)}
#handle{width:100%;padding:9px 0 4px;display:block;background:none;border:0;cursor:grab}
#handle span{display:block;width:36px;height:4px;margin:auto;border-radius:2px;background:var(--line)}
nav{display:grid;grid-template-columns:repeat(4,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{all:unset;cursor:pointer;text-align:center;padding:7px 2px 11px;font-weight:500;font-size:15px;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--accent);font-weight:700}
#body{flex:1;min-height:0;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
#detail{z-index:5}
.pad{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.rg{font-size:13px;font-weight:500;color:var(--muted);padding-block:16px 4px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row .txt{display:flex;flex-direction:column;min-width:0}
.row b{font-weight:500;font-size:16px;line-height:1.25}
.row small{color:var(--muted);font-size:13px}
.row .odds{font-weight:700;font-size:15px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .odds span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.back{all:unset;cursor:pointer;font-weight:500;color:var(--accent)}
.kicker{font-size:13px;font-weight:500;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;text-decoration:none;font-weight:500;font-size:14px;padding:9px 12px;border-radius:8px;background:var(--raised);color:var(--ink);border:0;cursor:pointer}
.btn.main,.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border-radius:8px;padding:10px;min-width:0}
.stats b{display:block;font-weight:700;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
section{display:flex;flex-direction:column;gap:9px;min-width:0}
.card{background:var(--surface);border-radius:8px;padding:12px 13px;min-width:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:14px}
.quiet{color:var(--muted);font-size:13px;margin:0}
.big{font-weight:800;font-stretch:125%;font-size:48px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;border-radius:3px;background:var(--accent);min-width:2px}
.bar span:first-child{color:var(--muted)}
.bar span:last-child{text-align:right}
.sp{grid-template-columns:minmax(0,132px) minmax(0,1fr) 34px}
.sp span:first-child{color:var(--ink)}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.tl li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding-block:11px;border-top:1px solid var(--line)}
ol.tl li:first-child{border-top:0}
.when{font-weight:700;font-size:15px;line-height:1.2}
.when small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
li.past .when,li.past .what{opacity:.5}
li.key .when{color:var(--accent)}
.what b{display:block;font-weight:500}
.what{min-width:0;font-size:14px}
input[type=date],input[type=text]{font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;max-width:260px}
input.mono{font-family:var(--mono);max-width:none}
label{font-weight:500;font-size:14px;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
td.mono{font:500 13px var(--mono);white-space:nowrap}
.scroll{overflow-x:auto}
details{background:var(--surface);border-radius:8px;min-width:0}
summary{cursor:pointer;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:500}
summary span{font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
details .inner{padding:0 13px 12px;display:flex;flex-direction:column;gap:8px}
.tag{font-size:12px;padding:1px 6px;border-radius:4px;background:var(--raised);font-weight:500}
.tag.old{background:var(--warn-bg);color:var(--warn)}
#hit{font-size:15px}
#hit b.entry{font-weight:800;font-size:30px;line-height:1.1;color:var(--accent);display:block;margin-bottom:4px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
@media (min-width:860px){
  #sheet{top:0;bottom:0;left:0;right:auto;width:400px;height:100%;border-radius:0;border-right:1px solid var(--line);transform:none;transition:none}
  #handle{display:none}
  #legend{left:calc(100% + 12px);right:auto;bottom:12px;width:max-content}
  .sheet-full #legend{display:flex}
  nav button{padding-top:13px}
  #brand{left:414px}
  .sheet-full #top{display:flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

/* Lays a GPS-tagged map image on the map from three known corners, so slight rotation stays true. */
const CornerOverlay = L.Layer.extend({
  initialize(meta, opacity){ this.meta = meta; this.opacity = opacity; },
  onAdd(m){
    this._map = m;
    const img = new Image();
    img.onload = () => { if (this._map) this._draw(img); };
    img.onerror = () => { flash('This hunt map image did not load.'); };
    boundsReady.finally(() => { img.src = this.meta.img; });
    m.on('zoom viewreset zoomend moveend', this._place, this);
  },
  onRemove(m){ m.off('zoom viewreset zoomend moveend', this._place, this); if (this.el) this.el.remove(); this._map = null; },
  _draw(img){
    /* Paper white goes clear so the imagery shows through under the map's linework. */
    let el = img;
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const x = c.getContext('2d', {willReadFrequently:true});
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        const low = Math.min(p[i], p[i + 1], p[i + 2]);
        if (low > 238) p[i + 3] = 0;
        else if (low > 205) p[i + 3] = Math.round(p[i + 3] * (238 - low) / 33);
      }
      x.putImageData(d, 0, 0);
      this._mask(x, c);
      el = c;
    } catch (e) {}
    this.w = img.naturalWidth; this.h = img.naturalHeight;
    el.className = 'overlay-map leaflet-zoom-hide';
    const s = this.meta.clip;
    el.style.clipPath = `inset(${s[0]}% ${s[1]}% ${s[2]}% ${s[3]}%)`;
    el.style.opacity = this.opacity;
    this.el = el;
    this._map.getPane('overlayPane').prepend(el);
    this._place();
  },
  _mask(x, c){
    const fs = boundaryFeatures.filter(f => f.properties.area === MASK[this.meta.refuge]);
    if (!fs.length) return;
    const [tl, tr, bl] = this.meta.corners;
    const ax = tr[1] - tl[1], ay = tr[0] - tl[0], bx = bl[1] - tl[1], by = bl[0] - tl[0], det = ax * by - bx * ay;
    const px = ([lng, lat]) => {
      const dx = lng - tl[1], dy = lat - tl[0];
      return [(dx * by - bx * dy) / det * c.width, (ax * dy - dx * ay) / det * c.height];
    };
    const m = document.createElement('canvas');
    m.width = c.width; m.height = c.height;
    const g = m.getContext('2d');
    g.beginPath();
    fs.forEach(f => {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      polys.forEach(rings => rings.forEach(ring => {
        ring.forEach((p, i) => { const [a, b] = px(p); if (i) g.lineTo(a, b); else g.moveTo(a, b); });
        g.closePath();
      }));
    });
    g.fill('evenodd');
    x.globalCompositeOperation = 'destination-in';
    x.drawImage(m, 0, 0);
    x.globalCompositeOperation = 'source-over';
  },
  _place(){
    if (!this.el || !this._map) return;
    const [tl, tr, bl] = this.meta.corners.map(c => this._map.latLngToLayerPoint(c));
    const a = (tr.x - tl.x) / this.w, b = (tr.y - tl.y) / this.w, c = (bl.x - tl.x) / this.h, d = (bl.y - tl.y) / this.h;
    this.el.style.transform = `matrix(${a},${b},${c},${d},${tl.x},${tl.y})`;
  },
  setOpacity(v){ this.opacity = v; if (this.el) this.el.style.opacity = v; }
});
function overlayBounds(o){
  const [tl, tr, bl] = o.corners, br = [tr[0] + bl[0] - tl[0], tr[1] + bl[1] - tl[1]];
  const lats = [tl[0], tr[0], bl[0], br[0]], lngs = [tl[1], tr[1], bl[1], br[1]];

  return L.latLngBounds([Math.min(...lats) + h * s[2] / 100, Math.min(...lngs) + w * s[3] / 100], [Math.max(...lats) - h * s[0] / 100, Math.max(...lngs) - w * s[1] / 100]);

function bindBoundary(f, l){

/* ---------- pull-up sheet ---------- */
const SNAP = {peek:.82, half:.5, full:0};
let sheetState = 'half';
function setSheet(s){
  sheetState = s;
  document.body.classList.toggle('sheet-full', s === 'full');
  document.documentElement.style.setProperty('--sheet-y', sheetOffset(s) + 'px');
}
function sheetOffset(s){
  const h = $('#sheet').offsetHeight;
  return s === 'peek' ? Math.max(0, h - 118) : Math.round(h * SNAP[s]);
}
function initSheet(){
  const sheet = $('#sheet'), grab = $('#grab');
  setSheet('half');
  let startY = 0, startOff = 0, drag = false, moved = 0;
  grab.addEventListener('pointerdown', e => {
    if (innerWidth >= 860) return;
    drag = true; moved = 0; startY = e.clientY; startOff = sheetOffset(sheetState);
    grab.setPointerCapture(e.pointerId); sheet.classList.add('dragging');
  });
  grab.addEventListener('pointermove', e => {
    if (!drag) return;
    moved = Math.max(moved, Math.abs(e.clientY - startY));
    const y = Math.min(sheetOffset('peek'), Math.max(0, startOff + e.clientY - startY));
    document.documentElement.style.setProperty('--sheet-y', y + 'px');
  });
  const end = e => {
    if (!drag) return;
    drag = false; sheet.classList.remove('dragging');
    if (moved < 6) {
      /* A tap on a tab or the handle: open the sheet up if it is resting low. */
      const tab = document.elementFromPoint(e.clientX, e.clientY);
      if (tab && tab.closest('nav button')) { setTab(tab.closest('nav button').dataset.tab); if (sheetState === 'peek') setSheet('half'); }
      else setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek');
      return;
    }
    const y = startOff + e.clientY - startY;
    const best = Object.keys(SNAP).sort((a, b) => Math.abs(sheetOffset(a) - y) - Math.abs(sheetOffset(b) - y))[0];
    setSheet(best);
    if (map) setTimeout(() => map.invalidateSize(), 280);
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  addEventListener('resize', () => setSheet(sheetState));
}

const areaKey = n => String(n).toUpperCase();

  rows.forEach(x => [...new Set(x.top || [])].forEach(s => { if (/^[A-Z]{4}$/.test(s)) species[s] = (species[s] || 0) + 1; }));
  return {rows, days:rows.length, hunters:sum('hunters'), ducks:sum('ducks'), geese:sum('geese'), birds:sum('birds'), species, avg:sum('birds') / sum('hunters')};
}
function lastStats(r){
  const hit = (r.harvest || []).map(n => LAST_SEASON[areaKey(n)]).find(Boolean);
  return hit ? Object.assign({avg:hit.birds / hit.hunters}, hit) : null;
}

  return list.length ? `<div class="bars">${list.map(([s, n]) => `<div class="bar sp"><span>${esc(SPECIES[s] || s)}</span><i style="width:${Math.round(n / days * 100)}%"></i><span>${n}</span></div>`).join('')}</div>` : '<p class="quiet">No species reported.</p>';
}
function birdPage(r){
  const s = seasonStats(r), l = lastStats(r);

  let html = '';

    const peak = Math.max(...s.rows.map(x => x.avg || 0), 1);
    html += `<section><div class="kicker">2026-27 season so far</div><div class="big">${s.avg.toFixed(1)}</div><p class="quiet">birds per hunter, across ${s.days} hunt day${s.days === 1 ? '' : 's'}</p></section>
      <div class="stats"><div><b>${(s.ducks / s.hunters).toFixed(1)}</b><span>Ducks per hunter</span></div><div><b>${(s.geese / s.hunters).toFixed(1)}</b><span>Geese per hunter</span></div><div><b>${num(s.hunters)}</b><span>Hunter visits</span></div></div>
      <section><h3>Birds per hunter, by hunt day</h3><div class="bars">${s.rows.slice(0, 12).map(x => `<div class="bar"><span>${esc(x.date)}</span><i style="width:${Math.round((x.avg || 0) / peak * 100)}%"></i><span>${x.avg == null ? '–' : x.avg.toFixed(1)}</span></div>`).join('')}</div></section>

  }).then(d => { if (d && d.draws && d.draws.length) { DATA = d; renderAll(); } }).catch(() => {});
}
